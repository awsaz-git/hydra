# Copy to infra/backend-secret.yaml (gitignored) and fill in base64-encoded values.
# Encode each value from backend/.env without it landing in your shell history, e.g.:
#   grep '^LLM_API_KEY=' backend/.env | cut -d= -f2- | tr -d '"\n' | base64 -w0
#   grep '^DATABASE_URL=' backend/.env | cut -d= -f2- | tr -d '"\n' | base64 -w0
# CLERK_JWT_KEY is several lines long (in quotes), so it needs its own one-liner:
#   python3 -c 'import re,base64; m=re.search(r"^CLERK_JWT_KEY=\"(.*?)\"", open("backend/.env").read(), re.S | re.M); print(base64.b64encode(m.group(1).encode()).decode())'
# Only DATABASE_URL (hydra_app) goes in here, never MIGRATE_DATABASE_URL (hydra_owner).
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
type: Opaque
data:
  llm-api-key: BASE64_API_KEY
  database-url: BASE64_DATABASE_URL
  clerk-jwt-key: BASE64_CLERK_JWT_KEY
