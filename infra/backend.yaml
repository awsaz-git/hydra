apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ropemaxxing/hydra-backend:v3
          ports:
            - containerPort: 8080
          env:
            # Neon, role hydra_app, pooled host (the owner's password is never in the cluster).
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: database-url
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: llm-api-key
            # Clerk's public key (PEM), to check sign-in tokens. Not secret, but kept with the others.
            - name: CLERK_JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: clerk-jwt-key
            # The frontends allowed to send tokens (the laptop's Next.js for now)
            - name: CLERK_AUTHORIZED_PARTIES
              value: "http://localhost:3000"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080
